<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dartboard</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="blur"></div>
<div id="game-container">
    
    
    <div id="board-container">
        <nav>
        <button class="nav-button" id="back-button"> &#8592 <p class="button-text" id="back-text">+</p></button>
        <h1 id="board-name"></h1>
        <button  class="nav-button" id="forward-button"><p class="button-text" id="forward-text">+</p> &#8594</button>
        
         </nav>
        <div id="pop-up">
            <h2 id="pop-up-title">Dartbored</h2>
            <p id="pop-up-text"> Click the numbers on the outer ring to enter the answer and use the navigation buttons at the top of the screen to move between the levels. </p>
            <button id="pop-up-button">Close</button>
        </div>
       
    </div>
    
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script type="module" src="js/main.js"></script>
     <footer>
        <p>Original puzzle from the Billiard Room in the game <a href="https://store.steampowered.com/app/1569580/Blue_Prince/">Blue Prince</a> </p>
    </footer>
</div>

</body>
</html>
